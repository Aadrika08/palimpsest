name: Fixture checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # The source fixtures bind this Linux layout, tmpfs and the exact Python ELF.
    container:
      image: archlinux@sha256:dfb01267da058e5d08ffdc543bf484c9b404655b0bac1d0201d972bf950cdfd0
      options: >-
        --cap-add SYS_ADMIN --cap-add SYS_PTRACE
        --security-opt seccomp=unconfined --security-opt apparmor=unconfined
        --security-opt systempaths=unconfined
        --ulimit nofile=65536:65536
        --tmpfs /tmp:rw,exec,nosuid,nodev,size=4g --shm-size=2g
    defaults:
      run:
        shell: bash
    env:
      UV_PYTHON_INSTALL_DIR: /home/utkarsh/.local/share/uv/python
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Install namespace, compiler and EGL dependencies
        run: pacman -Syu --noconfirm --needed git gcc bubblewrap libglvnd mesa curl tar gzip xz python
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: ui/.node-version
      - name: Install the exact fixture interpreter and locked dependencies
        run: |
          curl --fail --location --output /tmp/uv.tar.gz https://github.com/astral-sh/uv/releases/download/0.9.25/uv-x86_64-unknown-linux-gnu.tar.gz
          printf '%s  %s\n' fa1f4abfe101d43e820342210c3c6854028703770f81e95b119ed1e65ec81b35 /tmp/uv.tar.gz | sha256sum --check -
          tar -xzf /tmp/uv.tar.gz -C /tmp
          install /tmp/uv-x86_64-unknown-linux-gnu/uv /usr/local/bin/uv
          uv python install 3.11.15 --no-bin --python-downloads-json-url "file://$PWD/.github/python-downloads.json"
          FIXTURE_PYTHON="$UV_PYTHON_INSTALL_DIR/cpython-3.11.15-linux-x86_64-gnu/bin/python3.11"
          printf '%s  %s\n' 572cfa2a8597e2f431c785613539b1d219fa99eecf5ffb5765731a2ebc3e692a "$FIXTURE_PYTHON" | sha256sum --check -
          printf '%s  %s\n' afa518f786b425fc598b11adbf60d667bf7fe7f5f0662a0cd6bbf6f3e25c8d21 "$UV_PYTHON_INSTALL_DIR/cpython-3.11.15-linux-x86_64-gnu/lib/python3.11/_sysconfigdata__linux_x86_64-linux-gnu.py" | sha256sum --check -
          uv sync --locked --no-python-downloads --python "$FIXTURE_PYTHON" --extra simulation --extra lab
          ln -s "$(command -v node)" /usr/bin/node
          npm ci --prefix ui
      - name: Give fixture processes ordinary user ownership
        run: |
          useradd --create-home fixture
          chown -R fixture:fixture "$GITHUB_WORKSPACE" "$UV_PYTHON_INSTALL_DIR"
      - name: Record fixture environment
        run: |
          .venv/bin/python -B -c 'import sys, importlib.metadata as m; print(sys.version); print({p: m.version(p) for p in ("torch", "torchvision", "numpy", "mujoco", "pytest")})'
          findmnt -T /tmp
          df -h . /tmp /dev/shm
          bwrap --version
          node --version
          runuser -u fixture -- git status --short
          runuser -u fixture -- bwrap --unshare-all --ro-bind / / --proc /proc --dev /dev /usr/bin/true
          runuser -u fixture -- prlimit --nofile=65536: -- .venv/bin/python -B -c 'import resource; limits = resource.getrlimit(resource.RLIMIT_NOFILE); print("fixture RLIMIT_NOFILE:", limits); assert limits == (65536, 65536)'
      - name: Check hosted environment boundaries before the full suite
        run: |
          runuser -u fixture -- prlimit --nofile=65536: -- scripts/run_tests.sh -- \
            tests/test_frozen_pins.py \
            tests/test_lab.py::Supervision::test_watchdog_terminates_owner_process_group \
            tests/test_bounded_qualification_descendants.py \
            tests/test_memory_family_allocation_v3.py::test_rollback_never_unlinks_a_replacement_inode \
            tests/test_memory_selected_pilot.py::test_worker_rejects_expired_original_owner_allocation_before_output \
            tests/test_manual_lab_refresh_v3.py::AdmissionAndGrace::test_real_tracker_exits_after_last_inherited_pipe_writer_closes \
            tests/test_verification_scripts.py::EnduranceProcessTests \
            tests/test_puck_held_runtime_parent.py::test_prepare_then_separately_pinned_qualification_executes_real_held_worker \
            tests/test_puck_cpu_namespace.py::test_real_two_bwrap_passes_preserve_raw_tmpfs_inode_and_held_custody \
            tests/test_puck_cpu_distributed_observer.py::test_cli_rejects_a_different_interpreter_before_allocating \
            tests/test_storage.py::StorageTests::test_nested_inventory_rejects_special_files_scan_errors_and_changed_root
          runuser -u fixture -- prlimit --nofile=65536: -- env PALIMPSEST_TEST_BASETEMP="$PWD/runs/hosted-preflight" \
            scripts/run_tests.sh -- \
            tests/test_puck_cpu_amendment_audit.py::test_real_authored02_has_independent_current_epoch_audit_and_exclusive_cli
      - name: Run fixture tests
        env:
          PALIMPSEST_TMPFS_BASETEMP: /tmp/palimpsest-pytest
        run: |
          runuser -u fixture -- prlimit --nofile=65536: -- scripts/run_tests.sh
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ui/.node-version
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install locked UI dependencies
        working-directory: ui
        run: npm ci
      - name: Type check and production build
        working-directory: ui
        run: npm run build
      - name: Check full-window browser measurements
        working-directory: ui
        run: npm run test:measurement
      - name: Check memory evidence annotations
        working-directory: ui
        run: npm run test:memory
