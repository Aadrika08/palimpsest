name: Fixture checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install CPU PyTorch
        run: python -m pip install torch==2.9.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install fixture dependencies
        run: |
          python -m pip install pytest==8.4.2 numpy==2.2.5 scipy==1.15.2 pandas==2.2.3 py7zr==1.1.3 mujoco==3.3.6
          python -m pip install matplotlib==3.10.1 httpx==0.28.1
          python -m pip install -e '.[lab]'
      - name: Run fixture tests
        run: python -m pytest -q
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ui/.node-version
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install locked UI dependencies
        working-directory: ui
        run: npm ci
      - name: Type check and production build
        working-directory: ui
        run: npm run build
      - name: Check full-window browser measurements
        working-directory: ui
        run: npm run test:measurement
      - name: Check memory evidence annotations
        working-directory: ui
        run: npm run test:memory
