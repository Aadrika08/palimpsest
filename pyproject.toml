[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "palimpsest"
version = "0.1.0.dev0"
description = "A local, inspectable lab for embodied neural controllers"
requires-python = ">=3.11,<3.12"
dependencies = []

[project.optional-dependencies]
simulation = [
  "torch==2.9.0",
  "torchvision==0.24.0",
  "numpy==2.2.5",
  "scipy==1.15.2",
  "pandas==2.2.3",
  "scikit-learn==1.8.0",
  "mujoco==3.3.6",
  "gymnasium==1.2.1",
  "glfw==2.10.0",
  "opencv-python==4.12.0.88",
  "matplotlib==3.10.1",
  "seaborn==0.13.2",
  "networkx==3.4.2",
  "python-louvain==0.16",
  "py7zr>=1.0,<2",
]

[project.scripts]
palimpsest = "palimpsest.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<9"]

[tool.hatch.build.targets.wheel]
packages = ["src/palimpsest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["simulation: requires the simulation extra and working renderer", "assets: requires verified FLYNN model assets"]
